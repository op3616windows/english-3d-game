<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordQuest — 3D English Learning Game</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="canvas-container"></div>
      <div id="ui-overlay">
        <header class="hud-header">
          <div class="hud-left">
            <div class="logo">WordQuest 3D</div>
            <div class="hud-level-badge" id="hud-level-badge">LV 1</div>
          </div>

          <div class="hud-center">
            <div class="hud-xp-container">
              <div class="hud-xp-header">
                <span class="hud-xp-label">TIẾN ĐỘ HỌC TẬP</span>
                <span class="hud-xp-text" id="hud-xp-text">0 / 100 XP</span>
              </div>
              <div class="hud-xp-bar-bg">
                <div class="hud-xp-bar-fill" id="hud-xp-bar-fill" style="width: 0%"></div>
              </div>
            </div>
          </div>

          <div class="hud-right">
            <button class="hud-inventory-btn" id="hud-inventory-btn" title="Mở túi đồ (Phím I)">
              🎒 Túi đồ <span class="hud-inventory-badge" id="hud-inventory-badge">0</span>
            </button>
            <div class="instructions">WASD: Đi | E: Tương tác | I: Túi đồ</div>
          </div>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
